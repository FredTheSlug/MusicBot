<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Rotation baked in (no CSS transform on full-viewport layer). The mask of the Sumi watermark: the glyphs
       are its shape only; index.html fills it with the theme's text colour at 7%. The kanji are character
       references so no editor or encoding can break them: ink, sound, music, harmony. An SVG used as a mask
       can't load the page's web fonts, so the fonts are the systems' own Mincho faces. -->
  <g transform="rotate(-12 150 150)">
    <g font-family="Yu Mincho, Hiragino Mincho ProN, Noto Serif CJK JP, Noto Serif JP, MS Mincho, serif" font-weight="500">
      <text x="28" y="88" font-size="62">&#x58A8;</text>
      <text x="168" y="118" font-size="48">&#x97F3;</text>
      <text x="56" y="218" font-size="42">&#x697D;</text>
      <text x="178" y="248" font-size="54">&#x548C;</text>
    </g>
  </g>
</svg>
