[package]
name = "cloutkings-desktop"
version = "0.3.0"
description = "Clout Kings Music Bot desktop companion"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-log = "2.10"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
log = "0.4"
souvlaki = "0.8.3"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-notification = "2.6"
tauri-plugin-autostart = "2.7"
tauri-plugin-updater = "2.13"
tauri-plugin-dialog = "2"
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
