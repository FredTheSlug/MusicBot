<!doctype html>
<html lang="en" data-theme="nebula">
<head>
  <meta charset="utf-8">
  <title>Clout Kings Mini-player</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- Every font a panel theme uses; browsers only download the ones a skin actually shows. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;600;700&family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500&display=swap">
  <link rel="stylesheet" href="mini.css">
  <link rel="stylesheet" href="themes.css">
</head>
<body>
  <div class="shell" id="shell">
    <!-- Opens above the player (or below it near the top of the screen); the window grows to fit. -->
    <section class="drawer" id="drawer" hidden>
      <div class="drawer-panel menu" id="menuPanel" hidden>
        <form class="search-row" id="searchForm" autocomplete="off">
          <input type="text" id="searchBox" class="search-box" placeholder="Search songs or paste a link" spellcheck="false" aria-label="Search songs or paste a link">
          <button type="button" id="settingsBtn" class="icon-btn" title="Mini-player settings" aria-label="Mini-player settings" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
          </button>
        </form>
        <ul class="results" id="results" aria-label="Search results"></ul>
        <div class="settings" id="settings" hidden>
          <label class="setting">
            <span>Background</span>
            <input type="range" id="opacity" min="15" max="100" step="1" value="100" aria-label="Background opacity">
            <span class="setting-value" id="opacityValue">100%</span>
          </label>
          <label class="setting">
            <span>Match panel theme</span>
            <input type="checkbox" id="matchPanel" class="switch" checked>
          </label>
          <label class="setting" id="themeRow" hidden>
            <span>Theme</span>
            <select id="themeSelect" aria-label="Mini-player theme"></select>
          </label>
        </div>
      </div>
      <div class="drawer-panel lyrics" id="lyricsPanel" hidden>
        <div class="lyrics-head">
          <span class="lyrics-title" id="lyricsTitle"></span>
          <span class="lyrics-note" id="lyricsNote"></span>
        </div>
        <div class="lyrics-body" id="lyricsBody"></div>
      </div>
    </section>

    <main class="mini" id="mini" data-tauri-drag-region>
      <div class="drop-hint" id="dropHint">Drop a Spotify playlist, album or song</div>
      <div class="disc" id="disc" data-tauri-drag-region>
        <img class="art" id="art" alt="" hidden>
        <span class="spindle"></span>
      </div>

      <section class="info" data-tauri-drag-region>
        <div class="title" id="title" data-tauri-drag-region>Connecting…</div>
        <div class="meta" id="meta" data-tauri-drag-region></div>

        <div class="progress" id="progress"><div class="progress-fill" id="progressFill"></div></div>

        <div class="controls">
          <button type="button" id="restart" class="ctrl" title="Restart song" aria-label="Restart song">
            <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
          </button>
          <button type="button" id="toggle" class="ctrl primary" title="Pause" aria-label="Pause">
            <svg viewBox="0 0 24 24" id="toggleIcon"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          </button>
          <button type="button" id="skip" class="ctrl" title="Skip" aria-label="Skip">
            <svg viewBox="0 0 24 24"><path d="M4 5v14l10.5-7zM16 5h2v14h-2z"/></svg>
          </button>
          <input type="range" id="volume" class="volume" min="0" max="150" step="1" value="100" title="Volume" aria-label="Volume">
          <button type="button" id="openPanel" class="open-panel" hidden>Open panel</button>
        </div>

        <div class="bottom-row">
          <button type="button" id="spotifyBtn" class="icon-btn spotify" disabled title="Spotify isn't open" aria-label="Spotify isn't open">
            <svg viewBox="0 0 24 24"><circle class="sp-disc" cx="12" cy="12" r="10.5"/><path class="sp-waves" d="M6.6 9.3c3.7-1.1 7.9-.8 11 1M7.3 12.4c3.1-.8 6.4-.5 9 .9M8 15.3c2.4-.6 4.9-.4 6.9.7"/></svg>
          </button>
          <button type="button" id="lyricsBtn" class="icon-btn" disabled title="Lyrics" aria-label="Lyrics" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1a7 7 0 0 0 6-6.9z"/></svg>
          </button>
          <div class="status" id="status" role="status" aria-live="polite"></div>
          <button type="button" id="menuBtn" class="icon-btn" title="Search and settings" aria-label="Search and settings" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zM4 11h16v2H4zM4 16h16v2H4z"/></svg>
          </button>
        </div>
      </section>

      <button type="button" class="close" id="close" title="Hide mini-player" aria-label="Hide mini-player">
        <svg viewBox="0 0 24 24"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg>
      </button>
    </main>
  </div>
  <script src="view.js"></script>
  <script src="mini.js"></script>
</body>
</html>
